[build]
functions = "netlify/functions"

[[headers]]
for = "/assets/music/*"
[headers.values]
Access-Control-Allow-Origin = "*"
Access-Control-Allow-Methods = "GET"
Access-Control-Allow-Headers = "Content-Type"

[functions]
  external_node_modules = ["dotenv"]
  name = "cleanupCart"
  schedule = "0 0 * * *"
